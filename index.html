async function dec(pw){var raw=Uint8Array.from(atob(DATA),function(c){return c.charCodeAt(0)});var salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,256);var key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);return new TextDecoder().decode(pt);}
async function go(pw,quiet){try{var html=await dec(pw);try{localStorage.setItem('k39mk',pw)}catch(e){}document.open();document.write(html);document.close();}catch(e){try{localStorage.removeItem('k39mk')}catch(x){}if(!quiet)document.getElementById('e').textContent='パスワードが違います。';}}
